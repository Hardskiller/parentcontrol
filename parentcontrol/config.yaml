name: ParentControl
version: "0.1.0"
slug: parentcontrol
description: Stuft laufende YouTube-Videos per Ollama nach FSK ein und pausiert ungeeignete.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
image: ghcr.io/hardskiller/parentcontrol-{arch}
options:
  media_player: media_player.tv
  age_entity: input_number.kind_alter
  enabled_entity: input_boolean.youtube_pruefung
  ollama_url: http://ollama.local:11434
  ollama_model: gemma4-26b:latest
  poll_seconds: 3
schema:
  media_player: str
  age_entity: str
  enabled_entity: str
  ollama_url: url
  ollama_model: str
  poll_seconds: int(1,60)

name: Build add-on

on:
  push:
    branches: [main]
    paths:
      - "parentcontrol/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python parentcontrol/tests/test_pruefung.py

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          echo "version=$(sed -n 's/^version: "\(.*\)"$/\1/p' parentcontrol/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: parentcontrol
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/hardskiller/parentcontrol-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/hardskiller/parentcontrol-${{ matrix.arch }}:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.version.outputs.version }}
